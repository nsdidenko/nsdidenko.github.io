<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <title>{{ page.title | escape }}</title>
  <meta name="description" content="{{ page.description | escape }}">
  {%- if site.google_site_verification %}
  <meta name="google-site-verification" content="{{ site.google_site_verification }}">
  {%- endif %}
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  {%- for alt in page.hreflang %}
  <link rel="alternate" hreflang="{{ alt.lang }}" href="{{ alt.href }}">
  {%- endfor %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:locale" content="{{ page.og_locale }}">
  {%- if page.og_image %}
  <meta property="og:image" content="{{ site.url }}{{ page.og_image }}">
  {%- endif %}
  <link rel="icon" type="image/png" href="/microphone/img/app-icon.png">
  <link rel="apple-touch-icon" href="/microphone/img/app-icon.png">
  <link rel="stylesheet" href="/assets/seo.css">
</head>
<body>
  {%- include seo-header.html -%}
  <main class="wrap" id="content">
    <article class="seo-page">
      {{ content }}
    </article>
  </main>
  {%- include seo-footer.html -%}
</body>
</html>
